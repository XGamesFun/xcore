name: Bug report
description: Something in xcore does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through SECURITY.md, not a public issue. Never paste tokens, keys or `.env` contents here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands, and a minimal game folder if you can share one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, ideally with GAMESFUN_DEBUG=1.
      render: text
  - type: input
    id: version
    attributes:
      label: xcore version
      placeholder: output of `xcore --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system and Node version
      placeholder: e.g. macOS 15, Node 24.1.0
    validations:
      required: true
